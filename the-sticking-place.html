<!DOCTYPE html>
<html>
  <head>
    <title>The Sticking Place</title>
    <link rel ="stylesheet" href="styles/the-sticking-place.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <img src="imgs/logo-2.png" class="logo">
    <h1> More information coming soon...</h1>
    <form class="subscription-form">
      <p class="helper-text" id="email-help">
          Subscribe to our newsletter to recieve development updates.
      </p>
      <label id="subscription-label">
        Enter email to subscribe
      </label>
      <div class="form-row">
        <input id="input-box"
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          aria-describedby="email-help"
          required
        />

        <button type="submit" class="submit-button"> 
          Subscribe
        </button>
      </div>
    </form>
  </body>
</html>
